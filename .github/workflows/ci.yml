name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']   # releases are handled by release.yml
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build zlib from source
        shell: cmd
        run: |
          curl -fsSL https://github.com/madler/zlib/archive/e3dc0a85b7032e98380dec011bc8f2c2ee0d8fca.tar.gz -o zlib.tar.gz
          tar -xf zlib.tar.gz
          cd zlib-e3dc0a85b7032e98380dec011bc8f2c2ee0d8fca
          nmake /f win32\Makefile.msc
          cd ..
          if not exist dist\zlib\lib\x64 mkdir dist\zlib\lib\x64
          copy zlib-e3dc0a85b7032e98380dec011bc8f2c2ee0d8fca\zlib.lib dist\zlib\lib\x64\zlib.lib

      - name: Build
        shell: cmd
        run: nmake build
